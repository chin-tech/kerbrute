name: Build and Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: 1.18

      - name: Build (make all)
        run: make all
        working-directory: .

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: ./dist/

  github-release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: ./dist

      - name: Create GitHub Release and upload assets
        id: create_release
        uses: softprops/action-gh-release@v1
        with:
          files: dist/*
          # This creates the release and automatically includes the source code archives.
          # The 'files' parameter then attaches your built binaries.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
